<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artifact Lens</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <div class="top">
    <div class="brand">
      <h1>Artifact Lens</h1>
      <div class="muted">Browse GitHub Actions screenshots and media.</div>
    </div>
    <div id="account"></div>
  </div>
  <div id="error" class="error"></div>
  <div id="app" class="card"><div class="muted">Loading…</div></div>
</main>
<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Image preview">
  <div class="lightbox-dialog">
    <button class="lightbox-close" aria-label="Close image preview">×</button>
    <button id="lightboxPrev" class="lightbox-prev" aria-label="Previous image">‹</button>
    <img id="lightboxImage" class="lightbox-image" alt="">
    <button id="lightboxNext" class="lightbox-next" aria-label="Next image">›</button>
    <div id="lightboxMeta" class="lightbox-meta"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
