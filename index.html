<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artifact Lens</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui;color:#e8edf4;background:#0b0f14}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17202b,#0b0f14 42%);min-height:100vh}main{max-width:1180px;margin:auto;padding:36px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand h1{font-size:30px;margin:0}.muted{color:#8794a5}.card{background:#111821;border:1px solid #253140;border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 12px 36px #0004}button,input{font:inherit}button{border:1px solid #334359;background:#182331;color:#eef4fb;border-radius:10px;padding:10px 14px;cursor:pointer}button.primary{background:#f2f5f8;color:#0b0f14;border-color:#fff;font-weight:700}input{width:100%;padding:11px 13px;background:#0c1219;border:1px solid #2a3747;color:#fff;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.repo,.branch,.run,.artifact{padding:14px;border:1px solid #293747;border-radius:12px;background:#0d141c;cursor:pointer}.repo:hover,.branch:hover,.run:hover,.artifact:hover{border-color:#62758d}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{font-size:12px;border:1px solid #38475a;border-radius:999px;padding:3px 8px;color:#aeb9c8}.badge.success{color:#6ee7a8;border-color:#245d43;background:#0f2a20}.badge.failure{color:#ff8b8b;border-color:#713434;background:#321717}.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.crumbs button{padding:7px 10px}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.media figure{margin:0;border:1px solid #293747;border-radius:14px;overflow:hidden;background:#070b0f}.media img,.media video,.media iframe{width:100%;height:260px;object-fit:contain;background:#05080b;border:0}.media audio{width:100%;padding:18px}.media figcaption{padding:10px 12px;color:#a8b4c4;font-size:13px;word-break:break-all}.hidden{display:none}.error{color:#ff9c9c;white-space:pre-wrap}.spin{opacity:.65}.login{display:flex;gap:12px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div class="brand"><h1>Artifact Lens</h1><div class="muted">Browse GitHub Actions screenshots and media.</div></div><div id="account"></div></div><div id="error" class="error"></div><div id="app" class="card"><div class="muted">Loading…</div></div></main><script>
const app=document.querySelector('#app'), account=document.querySelector('#account'), err=document.querySelector('#error'); let S={repo:null,branch:null,run:null};
async function api(u){err.textContent=''; const r=await fetch(u); if(r.status===401){renderLogin();throw new Error('AUTH')} const d=await r.json(); if(!r.ok) throw new Error(d.error||JSON.stringify(d)); return d}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ago(d){const n=(Date.now()-new Date(d))/1000; if(n<60)return `${Math.floor(n)}s ago`; if(n<3600)return `${Math.floor(n/60)}m ago`; if(n<86400)return `${Math.floor(n/3600)}h ago`; return `${Math.floor(n/86400)}d ago`}
function statusClass(status=''){return status==='success'?'success':status==='failure'?'failure':''}
function renderLogin(){account.innerHTML='';app.innerHTML=`<div style="text-align:center;padding:38px 12px"><h2>Sign in with GitHub</h2><p class="muted">GitHub login is required so Artifact Lens can access Actions artifacts, including private repositories you can read.</p><button class="primary" onclick="location.href='/api/auth/login'">Continue with GitHub</button></div>`}
async function boot(){try{const me=await api('/api/me'); account.innerHTML=`<div class="login"><img class="avatar" src="${me.avatar_url}"><span>${esc(me.login)}</span><button onclick="location.href='/api/auth/logout'">Log out</button></div>`; showRepos()}catch(e){if(e.message!=='AUTH'){err.textContent=e.message;renderLogin()}}}
async function showRepos(){S={repo:null,branch:null,run:null};app.innerHTML='<div class="muted">Loading repositories…</div>';try{const repos=await api('/api/repos');app.innerHTML=`<div class="row"><div><h2 style="margin:0">Repositories</h2><div class="muted">Accessible repositories, most recently updated first.</div></div></div><div style="margin:16px 0"><input id="manual" placeholder="owner/repository" onkeydown="if(event.key==='Enter')pickRepo(this.value)"></div><div class="grid">${repos.map(r=>`<div class="repo" onclick="pickRepo('${esc(r.full_name)}')"><div class="row"><strong>${esc(r.full_name)}</strong>${r.private?'<span class="badge">private</span>':''}</div><div class="muted" style="margin-top:8px">${esc(r.description||'No description')}</div><div class="muted" style="margin-top:10px;font-size:12px">Updated ${ago(r.updated_at)}</div></div>`).join('')}</div>`}catch(e){err.textContent=e.message}}
window.pickRepo=async function(repo){repo=repo.trim();if(!repo.includes('/'))return;S.repo=repo;S.branch=null;S.run=null;app.innerHTML='<div class="muted">Finding branches with artifacts…</div>';try{const rows=await api('/api/repo/branches?repo='+encodeURIComponent(repo));app.innerHTML=crumbs()+`<h2>Branches with artifacts</h2><div class="grid">${rows.map(b=>`<div class="branch" onclick="pickBranch('${encodeURIComponent(b.branch)}')"><div class="row"><strong>${esc(b.branch)}</strong><span class="badge">${b.count} artifacts</span></div><div class="muted" style="margin-top:8px">Last artifact ${ago(b.updated_at)}</div></div>`).join('')||'<div class="muted">No artifacts found.</div>'}</div>`}catch(e){err.textContent=e.message}}
window.pickBranch=async function(encoded){S.branch=decodeURIComponent(encoded);S.run=null;app.innerHTML='<div class="muted">Loading workflow runs…</div>';try{const runs=await api('/api/repo/runs?repo='+encodeURIComponent(S.repo)+'&branch='+encodeURIComponent(S.branch));app.innerHTML=crumbs()+`<h2>Runs</h2><div class="grid">${runs.map(r=>{const status=r.conclusion||r.status;return `<div class="run" onclick='pickRun(${JSON.stringify(r)})'><div class="row"><strong>${esc(r.name)}</strong><span class="badge ${statusClass(status)}">${esc(status)}</span></div><div class="muted" style="margin-top:8px">${ago(r.updated_at)} · ${r.artifacts.length} artifact${r.artifacts.length!==1?'s':''}</div><div class="muted" style="margin-top:6px;font-size:12px">${esc(r.head_sha.slice(0,8))}</div></div>`}).join('')||'<div class="muted">No artifact-bearing runs found.</div>'}</div>`}catch(e){err.textContent=e.message}}
window.pickRun=function(r){S.run=r;app.innerHTML=crumbs()+`<h2>${esc(r.name)}</h2><div class="grid">${r.artifacts.map(a=>`<div class="artifact" onclick="pickArtifact(${a.id},'${esc(a.name)}')"><strong>${esc(a.name)}</strong><div class="muted" style="margin-top:8px">${(a.size_in_bytes/1024/1024).toFixed(1)} MB · ${ago(a.updated_at)}</div></div>`).join('')}</div>`}
window.pickArtifact=async function(id,name){app.innerHTML=crumbs()+`<h2>${esc(name)}</h2><div class="muted">Inspecting artifact…</div>`;try{const files=await api(`/api/repo/artifact?repo=${encodeURIComponent(S.repo)}&id=${id}`);const medias=files.filter(x=>x.media), other=files.filter(x=>!x.media);app.innerHTML=crumbs()+`<h2>${esc(name)}</h2><div class="media">${medias.map(f=>renderMedia(id,f)).join('')||'<div class="muted">No embeddable media detected.</div>'}</div>${other.length?`<h3>Other files</h3><div class="grid">${other.map(f=>`<div class="artifact"><strong>${esc(f.name)}</strong><div class="muted">${Math.round(f.size/1024)} KB</div></div>`).join('')}</div>`:''}` }catch(e){err.textContent=e.message}}
function renderMedia(id,f){const u=`/api/repo/artifact?repo=${encodeURIComponent(S.repo)}&id=${id}&file=${encodeURIComponent(f.name)}`;let body='';if(f.mime.startsWith('image/'))body=`<img loading="lazy" src="${u}">`;else if(f.mime.startsWith('video/'))body=`<video controls src="${u}"></video>`;else if(f.mime.startsWith('audio/'))body=`<audio controls src="${u}"></audio>`;else if(f.mime==='application/pdf')body=`<iframe src="${u}"></iframe>`;return `<figure>${body}<figcaption>${esc(f.name)}</figcaption></figure>`}
function crumbs(){return `<div class="crumbs"><button onclick="showRepos()">Repositories</button>${S.repo?`<button onclick="pickRepo('${esc(S.repo)}')">${esc(S.repo)}</button>`:''}${S.branch?`<button onclick="pickBranch('${encodeURIComponent(S.branch)}')">${esc(S.branch)}</button>`:''}${S.run?`<button onclick='pickRun(${JSON.stringify(S.run)})'>Run #${S.run.id}</button>`:''}</div>`}
window.showRepos=showRepos;boot();
</script></body></html>
